name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Run golden experiment smoke tests
        env:
          PYTHONPATH: src
        run: |
          python experiments/lps_response.py
          python experiments/il4_response.py
          python experiments/phagocytosis.py
          python experiments/chemotaxis.py
          python experiments/dose_response.py

      - name: Generate figures smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m macrophage.viz
          test -f experiments/figures/lps_polarization.png
          test -f experiments/figures/il4_tfs.png
          test -f experiments/figures/chemotaxis_trajectories.png
